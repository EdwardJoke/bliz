<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bliz — recorded session</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #11141b;
    --panel-2: #0e1117;
    --line: #1e2430;
    --line-soft: #171c25;
    --ink: #e6ebf2;
    --ink-2: #9aa6b8;
    --ink-3: #5d6879;
    --accent: #4da3ff;
    --accent-dim: #2a6bb0;
    --green: #38d39f;
    --amber: #f0b429;
    --screen-bg: #0d0f14;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 620px at 18% -12%, #17203a 0%, transparent 62%),
      radial-gradient(900px 560px at 96% 8%, #10202a 0%, transparent 58%),
      var(--bg);
    color: var(--ink);
    font: 14px/1.5 var(--mono);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------------------------------------------------------------- header */
  .titlebar {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0));
    flex: 0 0 auto;
  }
  .lights { display: flex; gap: 7px; }
  .lights i {
    width: 11px; height: 11px; border-radius: 50%; display: block;
    background: #2b3242;
  }
  .lights i:nth-child(1) { background: #ff5f57; }
  .lights i:nth-child(2) { background: #febc2e; }
  .lights i:nth-child(3) { background: #28c840; }
  .titlebar h1 {
    margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .01em;
    color: var(--ink);
  }
  .titlebar h1 span { color: var(--ink-3); font-weight: 400; }
  .titlebar .spacer { flex: 1; }
  .chip {
    font-size: 11px; color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 3px 10px; background: rgba(255,255,255,.02);
    white-space: nowrap;
  }
  .chip b { color: var(--accent); font-weight: 600; }

  /* ------------------------------------------------------------ main split */
  main {
    flex: 1 1 auto; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) 292px;
  }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } .side { display: none; } }

  .stage {
    min-width: 0; min-height: 0;
    padding: 22px 22px 8px;
    display: flex; align-items: flex-start; justify-content: center;
    overflow: auto;
  }
  .window {
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--screen-bg);
    box-shadow: 0 24px 70px -28px rgba(0,0,0,.95), 0 0 0 1px rgba(255,255,255,.02) inset;
    overflow: hidden;
    transform-origin: top center;
  }
  .screen {
    margin: 0;
    padding: 14px 0;
    font-family: var(--mono);
    font-size: 12px;
    line-height: 15px;
    white-space: pre;
    tab-size: 1;
  }
  .screen .row { height: 15px; padding: 0 16px; }
  .screen .row.dirty-hint { outline: none; }

  /* ------------------------------------------------------------------ aside */
  .side {
    border-left: 1px solid var(--line);
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    display: flex; flex-direction: column; min-height: 0;
  }
  .side h2 {
    margin: 0; padding: 14px 16px 8px;
    font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600;
  }
  .steps { list-style: none; margin: 0; padding: 0 10px 10px; overflow: auto; flex: 1 1 auto; }
  .steps li {
    display: flex; align-items: baseline; gap: 9px;
    padding: 5px 8px; border-radius: 7px;
    color: var(--ink-3); font-size: 11.5px; cursor: pointer;
    transition: background .12s, color .12s;
  }
  .steps li:hover { background: rgba(255,255,255,.035); color: var(--ink-2); }
  .steps li .t { color: #445062; font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .steps li .k { color: #556176; flex: 0 0 auto; }
  .steps li.done { color: #6f7c90; }
  .steps li.done .t { color: #4d5868; }
  .steps li.active {
    background: rgba(77,163,255,.11);
    color: var(--ink);
    box-shadow: inset 2px 0 0 var(--accent);
  }
  .steps li.active .t, .steps li.active .k { color: var(--accent); }

  .legend { padding: 4px 16px 16px; font-size: 11.5px; color: var(--ink-3); border-top: 1px solid var(--line-soft); }
  .legend div { display: flex; gap: 10px; padding: 2.5px 0; }
  .legend kbd {
    font-family: var(--mono); font-size: 10.5px; color: var(--ink-2);
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px;
    padding: 1px 6px; background: rgba(255,255,255,.03); min-width: 26px; text-align: center;
  }
  .legend em { font-style: normal; color: var(--ink-3); }

  /* -------------------------------------------------------------- controls */
  footer {
    flex: 0 0 auto;
    border-top: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,0));
    padding: 11px 18px;
    display: flex; align-items: center; gap: 13px;
  }
  button {
    font: 600 12px/1 var(--mono);
    color: var(--ink); cursor: pointer;
    background: rgba(255,255,255,.045);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 12px;
    transition: background .12s, border-color .12s, transform .06s;
  }
  button:hover { background: rgba(255,255,255,.085); border-color: #2b3444; }
  button:active { transform: translateY(1px); }
  button.primary { background: rgba(77,163,255,.16); border-color: var(--accent-dim); color: #cfe4ff; }
  button.primary:hover { background: rgba(77,163,255,.24); }
  button.icon { min-width: 38px; text-align: center; }

  .scrub { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 12px; }
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 999px; background: #232b38; outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: var(--accent); border: 2px solid #0b0d12;
    box-shadow: 0 0 0 1px var(--accent-dim); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--accent); border: 2px solid #0b0d12; cursor: pointer;
  }
  .clock { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 12px; white-space: nowrap; }
  .clock b { color: var(--ink); font-weight: 600; }
  .speed { display: flex; gap: 4px; }
  .speed button { padding: 6px 9px; font-size: 11px; }
  .speed button.on { background: rgba(77,163,255,.18); border-color: var(--accent-dim); color: #cfe4ff; }
  #zoomLabel { color: var(--ink-3); font-size: 11px; min-width: 34px; text-align: center; }

  .loading { padding: 40px 18px; color: var(--ink-3); font-size: 12.5px; }
  .err { color: var(--amber); }
</style>
</head>
<body>

<header class="titlebar">
  <div class="lights"><i></i><i></i><i></i></div>
  <h1 id="ttl">bliz <span>· recorded session</span></h1>
  <div class="spacer"></div>
  <div class="chip" id="dims">—</div>
  <div class="chip">frame <b id="fno">0</b> / <span id="ftot">0</span></div>
</header>

<main>
  <div class="stage" id="stage">
    <div class="window" id="win">
      <pre class="screen" id="screen"><div class="row">decoding recording…</div></pre>
    </div>
  </div>

  <aside class="side">
    <h2>Script</h2>
    <ol class="steps" id="steps"></ol>
    <div class="legend">
      <h2 style="padding-left:0">Keys</h2>
      <div><kbd>↑↓</kbd><em>move</em></div>
      <div><kbd>space</kbd><em>toggle row</em></div>
      <div><kbd>a</kbd><em>select all</em></div>
      <div><kbd>tab</kbd><em>collapse group</em></div>
      <div><kbd>⏎</kbd><em>submit</em></div>
      <div><kbd>esc</kbd><em>cancel</em></div>
    </div>
  </aside>
</main>

<footer>
  <button id="play" class="primary">▶ Play</button>
  <button id="restart" class="icon" title="Restart">⟲</button>
  <div class="scrub">
    <input type="range" id="scrub" min="0" max="0" value="0" step="1">
    <div class="clock"><b id="cur">0.00</b> / <span id="dur">0.00</span>s</div>
  </div>
  <div class="speed" id="speed">
    <button data-s="0.5">0.5×</button>
    <button data-s="1" class="on">1×</button>
    <button data-s="2">2×</button>
  </div>
  <button id="zoomOut" class="icon" title="Smaller">−</button>
  <span id="zoomLabel">100%</span>
  <button id="zoomIn" class="icon" title="Larger">+</button>
</footer>

/* ------------------------------------------------------------------ palette */

const BASE16 = [
  [0,0,0],[205,49,49],[13,188,121],[229,229,16],
  [36,114,200],[188,63,188],[17,168,205],[229,229,229],
  [102,102,102],[241,76,76],[35,209,139],[245,245,67],
  [59,142,234],[214,112,214],[41,184,219],[255,255,255]
];

function xterm256(i) {
  if (i < 16) return BASE16[i];
  if (i < 232) {
    const n = i - 16;
    const step = v => (v ? v * 40 + 55 : 0);
    return [step((n / 36) | 0), step(((n / 6) | 0) % 6), step(n % 6)];
  }
  const v = (i - 232) * 10 + 8;
  return [v, v, v];
}
const CSS = new Array(256);
for (let i = 0; i < 256; i++) CSS[i] = "rgb(" + xterm256(i).join(",") + ")";

/* ------------------------------------------------------------------ emulator */

/* A cell grid plus just enough of a VT to run this one protocol:
   cursor-up (CSI n A), cursor home (H), erase-below (J) / erase-line (K),
   SGR (m) with bold/dim/inverse and 256-colour foregrounds, CR, LF, and
   real auto-wrap with a pending-wrap flag so exactly `cols` printable cells
   never spill onto the next row. */
class Screen {
  constructor(cols, rows) {
    this.cols = cols; this.rows = rows;
    this.reset();
  }
  reset() {
    const n = this.cols * this.rows;
    this.ch = new Array(n).fill(" ");
    this.fg = new Int16Array(n).fill(-1);
    this.at = new Uint8Array(n);            // bit 1 bold, bit 2 dim, bit 4 inverse
    this.x = 0; this.y = 0; this.wrap = false;
    this.cur_fg = -1; this.cur_at = 0;
  }
  idx(x, y) { return y * this.cols + x; }
  put(code) {
    if (this.wrap) { this.wrap = false; this.x = 0; this.y++; }
    if (this.y >= this.rows) return;         // past the bottom: drop it, like a real terminal
    const i = this.idx(this.x, this.y);
    this.ch[i] = code; this.fg[i] = this.cur_fg; this.at[i] = this.cur_at;
    if (this.x + 1 >= this.cols) this.wrap = true; else this.x++;
  }
  clearFrom(x, y) {
    for (let r = y; r < this.rows; r++) {
      const from = r === y ? x : 0;
      for (let c = from; c < this.cols; c++) {
        const i = this.idx(c, r);
        this.ch[i] = " "; this.fg[i] = -1; this.at[i] = 0;
      }
    }
  }
  clearLine(y) {
    for (let c = 0; c < this.cols; c++) {
      const i = this.idx(c, y);
      this.ch[i] = " "; this.fg[i] = -1; this.at[i] = 0;
    }
  }
  /* Consumes one frame's byte string. */
  feed(text) {
    let i = 0;
    const n = text.length;
    while (i < n) {
      const c = text.charCodeAt(i);
      if (c === 0x1b) {
        i = this.escape(text, i);
      } else if (c === 0x0a) {                 // LF: the terminal is in ONLCR, so it is CR+LF
        this.y++; this.x = 0; this.wrap = false; i++;
      } else if (c === 0x0d) {
        this.x = 0; this.wrap = false; i++;
      } else if (c === 0x09) {
        this.x = Math.min(this.cols - 1, (this.x + 8) & ~7); i++;
      } else if (c < 0x20) {
        i++;
      } else {
        const len = c >= 0xd800 && c < 0xdc00 ? 2 : 1;
        this.put(text.substr(i, len));
        i += len;
      }
    }
  }
  escape(s, i) {
    const next = s.charCodeAt(i + 1);
    if (next !== 0x5b) return i + Math.min(2, s.length - i);   // only CSI appears here
    let j = i + 2, params = "";
    while (j < s.length) {
      const c = s.charCodeAt(j);
      if ((c >= 0x30 && c <= 0x3f)) { params += s[j]; j++; continue; }
      break;
    }
    while (j < s.length) {
      const c = s.charCodeAt(j);
      if (c >= 0x20 && c <= 0x2f) { j++; continue; }
      break;
    }
    if (j >= s.length) return j;
    const final = s[j];
    j++;
    this.csi(final, params);
    return j;
  }
  csi(final, params) {
    if (final === "?" || params.startsWith("?")) return;       // private modes: no-ops here
    const args = params.length ? params.split(";").map(v => (v === "" ? 0 : parseInt(v, 10))) : [];
    const a0 = args.length ? args[0] : 0;
    switch (final) {
      case "A": this.y = Math.max(0, this.y - (a0 || 1)); this.wrap = false; break;
      case "B": this.y = Math.min(this.rows - 1, this.y + (a0 || 1)); this.wrap = false; break;
      case "C": this.x = Math.min(this.cols - 1, this.x + (a0 || 1)); this.wrap = false; break;
      case "D": this.x = Math.max(0, this.x - (a0 || 1)); this.wrap = false; break;
      case "H": case "f": this.x = 0; this.y = 0; this.wrap = false; break;
      case "J":
        if (a0 === 2) this.clearFrom(0, 0); else this.clearFrom(this.x, this.y);
        this.wrap = false; break;
      case "K": this.clearLine(this.y); break;
      case "m": this.sgr(args); break;
      default: break;
    }
  }
  sgr(args) {
    const list = args.length ? args : [0];
    for (let k = 0; k < list.length; k++) {
      const v = list[k];
      if (v === 0) { this.cur_fg = -1; this.cur_at = 0; }
      else if (v === 1) this.cur_at |= 1;
      else if (v === 2) this.cur_at |= 2;
      else if (v === 7) this.cur_at |= 4;
      else if (v === 22) this.cur_at &= ~(1 | 2);
      else if (v === 27) this.cur_at &= ~4;
      else if (v === 39) this.cur_fg = -1;
      else if (v === 38 && list[k + 1] === 5) { this.cur_fg = list[k + 2]; k += 2; }
      else if (v === 38 && list[k + 1] === 2) { k += 4; }
    }
  }
  /* Renders one row as HTML, coalescing identical style runs and stopping at
     the last visible cell so trailing padding costs nothing. */
  rowHTML(y) {
    let end = 0;
    for (let x = this.cols - 1; x >= 0; x--) {
      const i = this.idx(x, y);
      if (this.ch[i] !== " " || this.fg[i] >= 0 || this.at[i] !== 0) { end = x + 1; break; }
    }
    let html = "", run = "", open = false, curF = -2, curA = -1;
    const flush = () => {
      if (run) { html += run.replace(/&/g, "&amp;").replace(/</g, "&lt;"); run = ""; }
    };
    for (let x = 0; x < end; x++) {
      const i = this.idx(x, y);
      const f = this.fg[i], a = this.at[i];
      if (f !== curF || a !== curA) {
        flush();
        if (open) html += "</span>";
        curF = f; curA = a;
        const st = [];
        if (f >= 0) st.push("color:" + CSS[f & 255]);
        if (a & 1) st.push("font-weight:700");
        if (a & 2) st.push("opacity:.55");
        if (a & 4) st.push("background:#e6ebf2;color:#0d0f14");
        html += st.length ? '<span style="' + st.join(";") + '">' : "<span>";
        open = true;
      }
      run += this.ch[i];
    }
    flush();
    return open ? html + "</span>" : html;
  }
}

/* --------------------------------------------------------------------- data */

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function decode(b64) {
  const bytes = b64ToBytes(b64);
  if (typeof DecompressionStream !== "function") {
    throw new Error("this browser has no DecompressionStream — needs Chrome 80+, Safari 16.4+ or Firefox 113+");
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

/* ------------------------------------------------------------------- player */

const $ = id => document.getElementById(id);
const screenEl = $("screen");
const stepsEl = $("steps");

let rec = null, snap = null, rowsHTML = [], t = 0, idx = 0, playing = false;
let speed = 1, zoom = 1, last = 0, raf = 0;

function ms(v) { return (v / 1000).toFixed(2) + "s"; }

function mount() {
  $("ttl").innerHTML = "bliz <span>· " + rec.title + "</span>";
  $("dims").textContent = rec.cols + "×" + rec.rows;
  $("ftot").textContent = rec.frames.length;
  $("dur").textContent = (rec.frames[rec.frames.length - 1].dt / 1000).toFixed(2);

  snap = new Screen(rec.cols, rec.rows);
  screenEl.innerHTML = "";
  rowsHTML = new Array(rec.rows).fill(null);
  for (let y = 0; y < rec.rows; y++) {
    const d = document.createElement("div");
    d.className = "row";
    screenEl.appendChild(d);
  }

  stepsEl.innerHTML = "";
  rec.steps.forEach((s, i) => {
    const li = document.createElement("li");
    li.dataset.at = s.at;
    li.innerHTML = '<span class="t">' + ms(s.at) +
      '</span><span class="k">' + s.kind + '</span><span>' + esc(s.label) + "</span>";
    li.onclick = () => { seek(s.at); paint(); };
    stepsEl.appendChild(li);
  });

  $("scrub").max = rec.frames.length - 1;
  fit();
  paint();
}

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

/* Replays frames 0..idx from scratch. Only used on seek, so the common path
   stays incremental. */
function replayTo(target) {
  snap.reset();
  for (let i = 0; i <= target; i++) snap.feed(rec.frames[i].text);
  idx = target;
  rowsHTML.fill(null);
}

function repaint() {
  const kids = screenEl.children;
  for (let y = 0; y < rec.rows; y++) {
    const html = snap.rowHTML(y);
    if (rowsHTML[y] !== html) { rowsHTML[y] = html; kids[y].innerHTML = html; }
  }
}

function highlight() {
  const at = rec.frames[idx].dt;
  const kids = stepsEl.children;
  let active = -1;
  for (let i = 0; i < rec.steps.length; i++) if (rec.steps[i].at <= at) active = i;
  for (let i = 0; i < kids.length; i++) {
    kids[i].classList.toggle("active", i === active);
    kids[i].classList.toggle("done", i < active);
  }
  const a = kids[active];
  if (a && !a.dataset.scrolled) {
    a.scrollIntoView({ block: "nearest" });
    a.dataset.scrolled = "1";
    setTimeout(() => { delete kids[active].dataset.scrolled; }, 400);
  }
}

function paint() {
  repaint();
  highlight();
  $("fno").textContent = idx + 1;
  $("scrub").value = idx;
  $("cur").textContent = (rec.frames[idx].dt / 1000).toFixed(2);
}

function step(delta) {
  const next = Math.max(0, Math.min(rec.frames.length - 1, idx + delta));
  if (next === idx) return;
  if (delta < 0) replayTo(next); else { for (let i = idx + 1; i <= next; i++) snap.feed(rec.frames[i].text); idx = next; }
  paint();
}

function seek(at) {
  let target = 0;
  for (let i = 0; i < rec.frames.length; i++) if (rec.frames[i].dt <= at) target = i;
  replayTo(target);
}

function tick(now) {
  raf = requestAnimationFrame(tick);
  const dt = Math.min(80, now - last);
  last = now;
  if (!playing) return;
  t += dt * speed;
  let moved = false;
  while (idx + 1 < rec.frames.length && rec.frames[idx + 1].dt <= t) {
    idx++;
    snap.feed(rec.frames[idx].text);
    moved = true;
  }
  if (moved) paint();
  if (idx >= rec.frames.length - 1) setPlaying(false);
}

function setPlaying(v) {
  playing = v;
  $("play").textContent = v ? "❚❚ Pause" : "▶ Play";
  if (v) {
    // Resume from wherever the scrubber is, not from a stale virtual clock.
    t = rec.frames[idx].dt;
    last = performance.now();
  }
}

/* ------------------------------------------------------------------- chrome */

function fit() {
  const stage = $("stage").getBoundingClientRect();
  const w = $("win").getBoundingClientRect().width / zoom;
  const avail = stage.width - 52;
  const z = Math.min(1.35, Math.max(0.45, avail / w));
  setZoom(z);
}
function setZoom(z) {
  zoom = z;
  $("win").style.transform = "scale(" + z + ")";
  $("zoomLabel").textContent = Math.round(z * 100) + "%";
  // Scaling does not shrink the layout box, so reserve the visual height.
  const h = $("win").getBoundingClientRect().height / z;
  $("win").style.marginBottom = (h * (z - 1)) + "px";
}

$("play").onclick = () => setPlaying(!playing);
$("restart").onclick = () => { replayTo(0); paint(); if (playing) setPlaying(true); };
$("scrub").oninput = e => { setPlaying(false); replayTo(+e.target.value); paint(); };
$("speed").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  speed = parseFloat(b.dataset.s);
  for (const k of $("speed").children) k.classList.toggle("on", k === b);
};
$("zoomIn").onclick = () => setZoom(Math.min(2, zoom + 0.1));
$("zoomOut").onclick = () => setZoom(Math.max(0.4, zoom - 0.1));

document.addEventListener("keydown", e => {
  if (!rec) return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "ArrowRight") { e.preventDefault(); setPlaying(false); step(1); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); setPlaying(false); step(-1); }
  else if (e.key === "Home") { setPlaying(false); replayTo(0); paint(); }
  else if (e.key === "End") { setPlaying(false); replayTo(rec.frames.length - 1); paint(); }
});
window.addEventListener("resize", () => { if (rec) fit(); });

/* --------------------------------------------------------------------- boot */

(async function () {
  try {
    rec = await decode(FRAMES_B64);
    mount();
    requestAnimationFrame(now => { last = now; raf = requestAnimationFrame(tick); setPlaying(true); });
  } catch (err) {
    screenEl.innerHTML = '<div class="row err">could not decode the recording</div>' +
                         '<div class="row err">' + esc(err.message) + "</div>";
  }
})();
</script>
</body>
</html>
